global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "market-collector"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["market-collector:8001"]

  - job_name: "feature-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["feature-service:8002"]

  - job_name: "model-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["model-service:8003"]

  - job_name: "training-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["training-service:8004"]

  - job_name: "risk-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["risk-service:8005"]

  - job_name: "signal-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["signal-service:8006"]

  - job_name: "paper-exec-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["paper-exec-service:8007"]

  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "notifier-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["notifier-service:8009"]
