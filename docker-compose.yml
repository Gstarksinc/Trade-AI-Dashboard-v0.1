name: signals

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-python: &python
  build:
    context: .
    dockerfile: docker/python.Dockerfile
  env_file: .env
  restart: unless-stopped
  logging: *logging
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    <<: *python
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - '127.0.0.1:8000:8000'

  collector:
    <<: *python
    command: python -m collector.main
    profiles: ['full']

  notifier:
    <<: *python
    command: python -m notifier.main
    profiles: ['full']

  trainer:
    <<: *python
    command: python -m models.train
    restart: 'no'
    mem_limit: 16g
    profiles: ['train']

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api
    profiles: ['full']
    logging: *logging

volumes:
  pgdata:
  redisdata:
